# CI for the EXAMVAN web server (the Go project lives in webui/).
#
# This workflow must live at the repository ROOT (.github/workflows/): GitHub
# Actions only discovers workflow files in the root .github/workflows
# directory — a workflow inside webui/.github/workflows would be ignored.
#
# The voucher lifecycle integration tests (internal/handlers/admin
# voucher_lifecycle_integration_test.go) need a real PostgreSQL, which they
# read from TEST_DATABASE_URL and SKIP when it is unset. The postgres service
# below provides that database, so the integration tests actually run on every
# push / pull request instead of silently skipping.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push beruntun ke branch yang sama → batalkan run yang masih jalan
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    env:
      # The service database below; the integration tests apply the schema
      # themselves and wipe only the data tables, so a fresh DB per run is
      # not required.
      TEST_DATABASE_URL: postgresql://examvan:examvan@localhost:5432/examvan_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: examvan
          POSTGRES_PASSWORD: examvan
          POSTGRES_DB: examvan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U examvan -d examvan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go-version-file is resolved relative to the repository root, and
          # the module lives in webui/ — hence the webui/ prefix.
          go-version-file: webui/go.mod
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
      - name: Build server
        run: go build ./cmd/server

  # Node unit tests for the admin frontend utilities (apiFetch interceptor,
  # global api:error listener). Runs against the real admin-core.js source.
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check admin scripts
        run: node --check static/js/admin-core.js && node --check static/js/admin.js
      - name: Run admin-core unit tests
        run: node --test static/js/admin-core.test.mjs

  # Unit test klien desktop (Python/PyQt5, ~79 test) — offscreen Qt.
  # Selama ini suite ini tidak pernah jalan di CI sama sekali.
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libs (offscreen)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libdbus-1-3
      - name: Install Python dependencies
        run: pip install PyQt5 PyMuPDF
      - name: Run desktop unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  # Build paket .deb Linux. Tanpa job ini, .deb pernah ikut ter-commit dalam
  # keadaan build LAMA: pkg-build/opt/examvan/examvan/ adalah salinan kode
  # yang tidak pernah di-sync, jadi paketnya pre-WebSocket, kehilangan
  # notify.py / ws.py / security/base.py / linux_backend.py /
  # waiting_approval.py, dan melaporkan APP_VERSION 2.2.0 saat source 2.5.0.
  # build-deb.sh sekarang menyalin dari desktop/examvan/ setiap kali build
  # dan menolak build bila hasilnya tidak identik — job ini yang membuat
  # guard itu tidak pernah diam-diam dilewati.
  desktop-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .deb
        run: ./desktop/build-deb.sh --clean

      # Guard di build-deb.sh sudah menolak build yang tidak lengkap, tapi
      # ini pemeriksaan independen dari file yang benar-benar terbit.
      - name: Verify package contents
        run: |
          set -euo pipefail
          DEB=$(ls desktop/dist/examvan-linux_*.deb)
          echo "Package: $DEB"
          listing="$(dpkg-deb -c "$DEB")"
          for m in notify.py ws.py security/base.py security/linux_backend.py ui/waiting_approval.py; do
            echo "$listing" | grep -qF "./opt/examvan/examvan/$m" \
              || { echo "::error::modul hilang dari paket: $m"; exit 1; }
            echo "OK  $m"
          done
          # Versi pada paket harus sama dengan APP_VERSION di source.
          src_ver=$(python3 -c "
          import re,pathlib
          t=pathlib.Path('desktop/examvan/__init__.py').read_text()
          print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"',t).group(1))")
          deb_ver=$(dpkg-deb -f "$DEB" Version)
          echo "source=$src_ver paket=$deb_ver"
          [ "$src_ver" = "$deb_ver" ] || { echo "::error::versi paket melenceng dari source"; exit 1; }
          # Bytecode mesin build tidak boleh bocor ke paket.
          if echo "$listing" | grep -q '__pycache__\|\.pyc$'; then
            echo "::error::bytecode bocor ke paket"; exit 1
          fi
          echo "OK  package verified"

      - name: Lint package metadata
        run: |
          set -euo pipefail
          DEB=$(ls desktop/dist/examvan-linux_*.deb)
          # Maintainer scripts harus executable, kalau tidak postinst diam-diam gagal.
          dpkg-deb --ctrl-tarfile "$DEB" | tar -tv | tee /dev/stderr | \
            grep -qE '^-rwxr-xr-x.*\./postinst$'
          dpkg-deb --ctrl-tarfile "$DEB" | tar -tv | grep -qE '^-rwxr-xr-x.*\./prerm$'
          dpkg-deb --ctrl-tarfile "$DEB" | tar -tv | grep -qE '^-rwxr-xr-x.*\./postrm$'
          echo "OK  maintainer scripts executable"
