# Build EXAMVAN Windows installer on GitHub Actions
#
# Trigger: push/PR ke main yang menyentuh desktop/, windows/, atau workflow
# ini sendiri (path filter — perubahan docs/webui tidak buang menit runner
# Windows), atau manual workflow_dispatch.
# Produces: EXAMVAN-Setup.exe + EXAMVAN.exe → release 'exe-latest'
#
# EXAMVAN-Setup.exe adalah yang dibagikan ke sekolah: SATU file,
# double-click, jalan — tanpa install Python. EXAMVAN.exe (portable)
# ikut terbit untuk kasus yang butuh app tanpa installer.

name: Build Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

# Push beruntun → build lama dibatalkan, installer dari commit terbaru saja
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # gh release upload (installer di-release, tidak kena kuota artifact)

# Versi/build/commit TIDAK ditulis di sini. Satu-satunya sumbernya
# windows/installer/build_info.py, yang membacanya dari APP_VERSION di
# desktop/examvan/__init__.py — konstanta yang sama dengan yang dilaporkan app
# ke server lewat X-App-Version. Duplikasi di sini pasti melenceng.

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe --tags butuh riwayat penuh

      - name: Resolve version / build / commit
        id: ver
        shell: pwsh
        run: |
          # build_info.py adalah SATU sumber kebenaran versi. Dipakai
          # juga oleh windows\build-setup.* supaya installer lokal dan
          # installer CI tidak pernah berbeda label.
          #
          # Nama define Inno (AppVersion, ...) dipetakan ke nama output
          # step (app_version, ...) supaya langkah lain tidak ikut
          # DependsOn versi. app_sha sengaja DIAMBIL ULANG di sini:
          # build_info.py hanya menyimpan short sha untuk label, tapi
          # release notes butuh full sha yang bisa diklik.
          $map = @{
            "AppVersion"     = "app_version"
            "AppVersionInfo" = "app_version_info"
            "AppBuild"       = "app_build"
            "AppCommit"      = "app_commit"
          }
          $defines = (python windows/installer/build_info.py).Trim()
          Write-Host "Defines: $defines"
          foreach ($d in $defines.Split(" ")) {
            $kv = $d.TrimStart("/D").Split("=", 2)
            if ($kv.Count -ne 2 -or -not $map.ContainsKey($kv[0])) {
              throw "Define tidak dikenal: $d"
            }
            "$($map[$kv[0]])=$($kv[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          "app_sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller

      # Metadata exe dibuat runtime supaya Properties → Details di PC
      # siswa menyebut commit yang benar. Tanpa ini semua exe lokal
      # terlihat identik padahal isinya beda jauh.
      - name: Stamp version info
        shell: pwsh
        run: |
          # Regex PowerShell hanya men-*patch* dua nilai StringStruct, jadi
          # FixedFileInfo (filevers/prodvers) TIDAK PERNAH disentuh: biner
          # setiap exe adalah 1.0.0.0 sementara ProductVersion 2.5.0. Build
          # lokal punya masalah lebih parah lagi — tidak men-*patch* apa pun.
          # build_info.py sekarang jadi satu-satunya implementasi aturan ini.
          New-Item -ItemType Directory -Force -Path windows\dist | Out-Null
          python windows/installer/build_info.py stamp `
            windows/installer/version_info.txt `
            windows/dist/version_info.txt `
            --version "${{ steps.ver.outputs.app_version }}" `
            --build "${{ steps.ver.outputs.app_build }}" `
            --commit "${{ steps.ver.outputs.app_commit }}"
          Get-Content windows/dist/version_info.txt | Select-String -Pattern 'vers='
          Get-Content windows/dist/version_info.txt | Select-String -Pattern "StringStruct\('(File|Product)Version'"

      - name: Build EXAMVAN.exe with PyInstaller
        # KONVENSI OUTPUT: semua artifact di windows/dist/ — sama persis dengan
        # build-exe.bat / build-setup.bat lokal. Examvan.iss mencari
        # "..\dist\EXAMVAN.exe" relatif terhadap windows/installer/, yaitu
        # windows/dist/. Dulu CI menaruh exe di <repo>/dist/ sehingga .iss
        # gagal dengan "Source file ... does not exist" padahal exe-nya ada
        # dan build PyInstaller-nya sukses.
        #
        # Entry = desktop/main.py (stub), bukan examvan/__main__.py — file
        # entry PyInstaller dijalankan sebagai script lepas, sedangkan
        # __main__.py memakai relative import yang crash saat exe dijalankan
        # ("attempted relative import with no known parent package").
        run: |
          python -m PyInstaller `
            --onefile `
            --windowed `
            --name "EXAMVAN" `
            --distpath windows/dist `
            --version-file windows/dist/version_info.txt `
            --icon windows/installer/examvan.ico `
            --hidden-import examvan `
            --hidden-import examvan.security `
            --hidden-import examvan.ui `
            --hidden-import examvan.ui.styles `
            --hidden-import examvan.ui.timer `
            --hidden-import examvan.ui.pdf_viewer `
            --hidden-import examvan.ui.answer_sheet `
            --hidden-import examvan.ui.fullscreen `
            --hidden-import examvan.ui.exam_viewer `
            --hidden-import examvan.ui.identity_dialog `
            --hidden-import examvan.ui.server_config `
            --hidden-import examvan.security.base `
            --hidden-import examvan.security.enforcer `
            --hidden-import examvan.security.windows_backend `
            --exclude-module examvan.security.x11 `
            --exclude-module examvan.security.linux_backend `
            --exclude-module examvan.security.kiosk `
            --add-data "desktop/examvan;examvan" `
            desktop/main.py
        working-directory: ${{ github.workspace }}

      # Installer Inno Setup: SATU file untuk PC siswa, tanpa Python.
      # PrivilegesRequired=lowest di .iss -> install per-user, tanpa UAC.
      - name: Build EXAMVAN-Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          # Inno Setup 6 sudah pre-installed di windows-latest.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe tidak ditemukan di $iscc" }
          # Define diambil ulang dari build_info.py, bukan dihitung ulang
          # di sini — VersionInfoVersion wajib numerik dan build_info.py
          # yang menjamin itu.
          $defines = (python windows/installer/build_info.py).Trim()
          Write-Host "Defines: $defines"
          & $iscc @($defines.Split(" ")) "windows\installer\examvan.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC gagal (exit $LASTEXITCODE)" }
          Get-Item windows\dist\EXAMVAN-Setup.exe

      # Smoke test: installer SEBENARNYA di-install di runner. Ini yang
      # menangkap .iss yang salah path, AppId bentrok, dan exe yang
      # tidak ikut ter-copy — semua yang tidak terlihat dari "build sukses".
      - name: Smoke test — install & uninstall senyap
        shell: pwsh
        run: |
          $setup = "$PWD\windows\dist\EXAMVAN-Setup.exe"
          $target = "$env:LOCALAPPDATA\Programs\EXAMVAN\EXAMVAN.exe"

          $p = Start-Process -FilePath $setup `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" `
            -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Install gagal, exit $($p.ExitCode)" }

          # R1: instalasi SENYAP dulu menghapus admin_password.txt tanpa
          # bersyarat, karena halaman password tidak pernah tampil saat
          # /VERYSILENT. Supervisor lalu terkunci saat ujian berjalan, tanpa
          # pesan dan tanpa exit code non-nol. Installer harus menulis file
          # ini lebih dulu, lalu instalasi kedua harus MEMBIRARKANNYA utuh.
          $pwFile = "$env:LOCALAPPDATA\EXAMVAN\admin_password.txt"
          "rahasia-smoke-123" | Set-Content -Path $pwFile -NoNewline -Encoding UTF8
          Write-Host "OK: password smoke test ditulis ke $pwFile"
          if (-not (Test-Path $target)) { throw "Install 'sukses' tapi $target tidak ada" }
          Write-Host "OK: EXAMVAN.exe ter-install di $target"

          # Upgrade senyap di atas password yang sudah ada.
          $p2 = Start-Process -FilePath $setup `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" `
            -PassThru -Wait
          if ($p2.ExitCode -ne 0) { throw "Upgrade gagal, exit $($p2.ExitCode)" }
          if (-not (Test-Path $pwFile)) {
            Write-Host "::error::password hilang setelah upgrade senyap"
            throw "instalasi senyap menghapus admin_password.txt"
          }
          $pwAfter = (Get-Content $pwFile -Raw).Trim()
          if ($pwAfter -ne "rahasia-smoke-123") {
            Write-Host "::error::password berubah setelah upgrade: '$pwAfter'"
            throw "instalasi senyap menimpa admin_password.txt"
          }
          Write-Host "OK: password utuh setelah upgrade senyap"

          # Shortcut harus terbentuk (desktop + Start Menu). Dulu ini hanya
          # Write-Host "WARN: ..." — shortcut hilang tidak pernah menggagalkan
          # build, padahal tanpa shortcut siswa di PC lab tidak bisa membuka
          # aplikasi sama sekali.
          $desktopLnk = "$env:USERPROFILE\Desktop\EXAMVAN.lnk"
          if (-not (Test-Path $desktopLnk)) {
            Write-Host "::error::shortcut desktop tidak terbentuk: $desktopLnk"
            throw "shortcut desktop tidak terbentuk"
          }
          Write-Host "OK: shortcut desktop ada"
          # Shortcut harus memakai ikon EXAMVAN, bukan ikon default PyInstaller
          # atau Inno. `IconFilename` di .iss menunjuk {app}\examvan.ico, jadi
          # yang dicek di sini adalah file-nya benar-benar ikut ter-install —
          # tanpa itu, .lnk ditulis tapi ikonnya hilang.
          $installedIcon = "$env:LOCALAPPDATA\Programs\EXAMVAN\examvan.ico"
          if (-not (Test-Path $installedIcon)) {
            Write-Host "::error::examvan.ico tidak ikut ter-install: $installedIcon"
            throw "ikon aplikasi tidak ikut ter-install"
          }
          $icoBytes = [System.IO.File]::ReadAllBytes($installedIcon)
          if ($icoBytes[0] -ne 0 -or $icoBytes[1] -ne 0 -or $icoBytes[2] -ne 1 -or $icoBytes[3] -ne 0) {
            Write-Host "::error::examvan.ico bukan file ICO yang sah"
            throw "examvan.ico rusak"
          }
          Write-Host "OK: ikon aplikasi ter-install ($($icoBytes.Length) bytes)"

          # Shortcut Start Menu juga — .iss:124-125 tidak pernah dicek.
          $startLnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" `
            -Filter "EXAMVAN.lnk" -Recurse -ErrorAction SilentlyContinue
          if (-not $startLnk) {
            Write-Host "::error::shortcut Start Menu tidak terbentuk"
            throw "shortcut Start Menu tidak terbentuk"
          }
          Write-Host "OK: shortcut Start Menu ada"

          # EXAMVAN.exe harus benar-benar start. Kita tidak mau console
          # yang menggantung, jadi start -> tunggu -> kill, lalu cek
          # tidak langsung crash (exit code null = masih hidup).
          $app = Start-Process -FilePath $target -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) {
            Write-Host "::error::EXAMVAN.exe langsung crash, exit $($app.ExitCode)"
            Get-Content "$env:USERPROFILE\.config\examvan\app.log" -Tail 40 -ErrorAction SilentlyContinue
            throw "EXAMVAN.exe crash saat start"
          }
          Write-Host "OK: EXAMVAN.exe hidup setelah 12 detik"

          # "Hidup 12 detik" BUKAN bukti app bisa jalan. Dalam 12 detik itu
          # yang terjadi hanya: dialog konfigurasi + Qt event loop. Tidak ada
          # network request, tidak ada api.py, tidak ada ws.py/QtWebSockets,
          # tidak ada pdf_viewer/fitz, tidak ada SecurityEnforcer. Semua
          # komponen yang paling rawan rusak oleh kesalahan packaging tidak
          # pernah dieksekusi.
          #
          # Yang bisa diassert tanpa jaringan adalah: app selesai menulis
          # log error, yaitu _setup_logging() benar-benar jalan. Kegagalan
          # lazy-import tidak terlihat dari exit code.
          $logPath = "$env:USERPROFILE\.config\examvan\app.log"
          if (-not (Test-Path $logPath)) {
            Write-Host "::error::app.log tidak dibuat — logging belum terpasang?"
            throw "app.log tidak ada setelah 12 detik"
          }
          $log = Get-Content $logPath -Raw
          Write-Host "---- app.log ----"
          Write-Host $log
          Write-Host "-----------------"
          if ($log -match "Traceback|ImportError|ModuleNotFoundError") {
            Write-Host "::error::app.log berisi traceback"
            throw "traceback di app.log — lazy import gagal"
          }
          # Bukti bahwa modul yang paling rawan benar-benar termuat.
          foreach ($needle in @("PyQt5", "examvan")) {
            if ($log -notmatch [regex]::Escape($needle)) {
              Write-Host "::error::app.log tidak menyebut $needle — awal logging mungkin tidak jalan"
              throw "app.log tidak menunjukkan inisialisasi yang diharapkan"
            }
          }
          Write-Host "OK: app.log menunjukkan inisialisasi bersih"

          # Matikan SELURUH process tree, bukan cuma parent.
          # PyInstaller --onefile berjalan sebagai dua proses: bootloader
          # parent mengekstrak ke %TEMP% lalu menjalankan app sebagai child.
          # Stop-Process pada parent saja meninggalkan child hidup, dan child
          # itu memegang exe yang di-install — uninstaller lalu keluar 0 tapi
          # tidak bisa menghapus file, persis yang terjadi di run sebelumnya
          # ("Uninstall tidak menghapus ...\EXAMVAN.exe" + GitHub juga menulis
          # "Terminate orphan process: (EXAMVAN)").
          taskkill /F /T /IM EXAMVAN.exe 2>&1 | Out-Null
          Start-Sleep -Seconds 3

          # Tunggu benar-benar tidak ada proses EXAMVAN.exe. Kalau masih ada,
          # uninstall pasti gagal — lebih baik berhenti dengan pesan jelas
          # daripada diam-diam menuduh installer salah.
          $still = Get-Process -Name EXAMVAN -ErrorAction SilentlyContinue
          if ($still) {
            Write-Host "::error::masih ada proses EXAMVAN: $($still.Id -join ',')"
            throw "EXAMVAN.exe tidak mau mati; uninstall tidak akan bisa menghapus file"
          }
          Write-Host "OK: tidak ada proses EXAMVAN tersisa"

          $unins = Get-ChildItem "$env:LOCALAPPDATA\Programs\EXAMVAN" -Filter "unins*.exe" -ErrorAction SilentlyContinue
          if ($unins) {
            $u = Start-Process -FilePath $unins[0].FullName `
              -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" `
              -PassThru -Wait
            Write-Host "Uninstall exit: $($u.ExitCode)"
            # Dulu exit code ini hanya di-log. Installer yang "sukses" tapi
            # gagal uninstall akan lolos ke rilis.
            if ($u.ExitCode -ne 0) {
              Write-Host "::error::uninstaller exit $($u.ExitCode)"
              throw "uninstaller gagal, exit $($u.ExitCode)"
            }
          } else {
            Write-Host "::error::unins*.exe tidak ditemukan di folder install"
            throw "uninstaller tidak ada"
          }
          # Beri uninstaller cukup waktu untuk melepas file lock.
          Start-Sleep -Seconds 3
          if (Test-Path $target) {
            Write-Host "Isi folder setelah uninstall:"
            Get-ChildItem "$env:LOCALAPPDATA\Programs\EXAMVAN" -Recurse |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "Uninstall tidak menghapus $target"
          }
          Write-Host "OK: uninstall bersih"

      # Padanan job Linux (`ci.yml` "Verify package contents"). Selama ini
      # tidak ada padanannya di Windows sama sekali, padahal paket .deb sudah
      # beberapa kali terkirim tanpa notify.py / ws.py / security/base.py /
      # ui/waiting_approval.py — kelas bug yang sudah TERBUKTI menggigit
      # proyek ini. Job ini menutup kelas yang sama di Windows.
      - name: Verify EXAMVAN.exe contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "windows\dist\EXAMVAN.exe"
          if (-not (Test-Path $exe)) { throw "exe tidak ada: $exe" }

          # PyInstaller onefile = arsip; namodule ada di TOC. Baca langsung
          # dari arsipnya, bukan dari source tree — yang diuji adalah apa
          # yang benar-benar terpaket.
          $names = python windows/installer/list_exe_modules.py $exe
          if (-not $names) { throw "gagal membaca TOC dari $exe" }
          Write-Host "Modul di dalam exe: $($names.Count)"

          # Modul yang BISA gagal hanya di Windows: dipanggil dari UI, tidak
          # diuji smoke test, dan punya binding ctypes.
          $required = @(
            "examvan",
            "examvan.api",
            "examvan.config",
            "examvan.models",
            "examvan.notify",
            "examvan.utils",
            "examvan.ws",
            "examvan.ui.answer_sheet",
            "examvan.ui.exam_viewer",
            "examvan.ui.fullscreen",
            "examvan.ui.identity_dialog",
            "examvan.ui.pdf_viewer",
            "examvan.ui.server_config",
            "examvan.ui.timer",
            "examvan.ui.waiting_approval",
            "examvan.security.base",
            "examvan.security.enforcer",
            "examvan.security.windows_backend"
          )
          $missing = @()
          foreach ($m in $required) {
            if ($names -notcontains $m) { $missing += $m }
          }
          if ($missing.Count -gt 0) {
            foreach ($m in $missing) { Write-Host "::error::modul hilang dari exe: $m" }
            throw "exe tidak lengkap: $($missing -join ', ')"
          }
          Write-Host "OK: semua $($required.Count) modul wajib ada di dalam exe"

          # Dependency native Qt yang dipakai runtime. Tanpa Qt5WebSockets.dll
          # ws.py gagal saat dipakai — dan tidak ada yang menyentuh ws.py
          # selama smoke test.
          $toc = (python windows/installer/list_exe_modules.py --raw $exe) -join ""
          foreach ($dll in @("Qt5WebSockets.dll", "Qt5Core.dll", "Qt5Gui.dll", "Qt5Widgets.dll")) {
            if ($toc -notmatch [regex]::Escape($dll)) {
              Write-Host "::error::DLL Qt tidak ter-bundle: $dll"
              throw "DLL Qt hilang: $dll"
            }
          }
          Write-Host "OK: DLL Qt ter-bundle"

          #_bytecode mesin build tidak boleh bocor ke exe.
          if ($names | Where-Object { $_ -match "__pycache__|\.pyc$" }) {
            throw "bytecode mesin build bocor ke exe"
          }
          Write-Host "OK: exe bersih"

      - name: Checksums
        id: sums
        shell: pwsh
        run: |
          $setup = "windows\dist\EXAMVAN-Setup.exe"
          $portable = "windows\dist\EXAMVAN.exe"
          $s1 = (Get-FileHash -Algorithm SHA256 $setup).Hash
          $s2 = (Get-FileHash -Algorithm SHA256 $portable).Hash
          "setup_sha=$s1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "portable_sha=$s2" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "EXAMVAN-Setup.exe  $s1"
          Write-Host "EXAMVAN.exe        $s2"

      - name: Upload artifact
        # continue-on-error + hanya non-PR: kuota Actions storage bisa penuh
        # (pernah — 222 artifact lama ~57MB menumpuk), dan PR tidak perlu
        # mengisi kuota. File utama dikirim via Release di bawah.
        continue-on-error: true
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EXAMVAN-Windows-${{ matrix.python-version }}
          path: |
            windows/dist/EXAMVAN-Setup.exe
            windows/dist/EXAMVAN.exe
          if-no-files-found: error

      - name: Upload installer to release (exe-latest)
        # Hanya push main / dispatch — PR tidak boleh menimpa installer
        # terbit dengan kode yang belum di-merge.
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "exe-latest"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY `
              --title "EXAMVAN Windows (build terbaru)" `
              --prerelease
          }
          gh release upload $tag windows/dist/EXAMVAN-Setup.exe windows/dist/EXAMVAN.exe `
            --repo $env:GITHUB_REPOSITORY --clobber
          Write-Host "::notice::EXAMVAN-Setup.exe terbit di release 'exe-latest'"

      # Checksum ditulis ulang tiap build --release-notes, jadi catatan
      # release selalu cocok dengan file yang sedang terbit (exe di-clobber,
      # notes-nya juga). Guru bisa verifikasi dengan certutil.
      - name: Publish checksums to release notes
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CATATAN: jangan pakai here-string @"..."@ di sini.
          # Penutupnya harus di kolom 0, sedangkan seluruh blok `run: |`
          # di-indent -- string-nya tidak pernah tertutup dan langkah ini
          # gagal dengan "accepts 1 arg(s), received 0".
          #
          # Dipakai array + --notes-file. Semua baris markdown ditulis
          # sebagai string single-quoted supaya backtick (yang banyak di
          # markdown) tidak perlu di-escape, dan hanya nilai dari step
          # sebelumnya yang di-interpolasi.
          $lines = @(
            '## EXAMVAN Windows - installer build terbaru'
            ''
            '**Cara pakai (guru/siswa):** download `EXAMVAN-Setup.exe`, double-click, selesai.'
            'Tidak perlu install Python, tidak perlu install apa-apa.'
            ''
            '| File | Untuk |'
            '|------|-------|'
            '| `EXAMVAN-Setup.exe` | installer: shortcut + Start Menu + uninstaller |'
            '| `EXAMVAN.exe` | portable: jalankan langsung dari USB, tanpa install |'
            ''
            '### Verifikasi file (anti-tampering / unduhan rusak)'
            ''
            '```'
            'certutil -hashfile EXAMVAN-Setup.exe SHA256'
            '```'
            ''
            '| File | SHA256 |'
            '|------|--------|'
            ('| `EXAMVAN-Setup.exe` | `' + '${{ steps.sums.outputs.setup_sha }}' + '` |')
            ('| `EXAMVAN.exe` | `' + '${{ steps.sums.outputs.portable_sha }}' + '` |')
            ''
            '### Build'
            ''
            '| | |'
            '|---|---|'
            ('| Versi | `' + '${{ steps.ver.outputs.app_version }}' + '` |')
            ('| Build | `' + '${{ steps.ver.outputs.app_build }}' + '` |')
            ('| Commit | `' + '${{ steps.ver.outputs.app_commit }}' + '` |')
            ('| SHA | `' + '${{ steps.ver.outputs.app_sha }}' + '` |')
            ''
            ('Full SHA: https://github.com/${{ github.repository }}/commit/${{ steps.ver.outputs.app_sha }}')
            ''
            '### "Windows protected your PC" / SmartScreen'
            ''
            'Installer **belum code-signed** (belum ada sertifikat Authenticode), jadi'
            'SmartScreen menampilkan peringatan kuning. Klik **More info** lalu'
            '**Run anyway**. Verifikasi dulu SHA256 di atas kalau ragu.'
            ''
            'Butuh Python? Tidak. Butuh Visual C++ Redistributable? Hanya kalau'
            '`EXAMVAN.exe` keluar error "DLL load failed" - installer sudah'
            'memperingatkan lebih awal kalau ini terjadi.'
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          ($lines -join "`n") | Out-File -FilePath $notesFile -Encoding utf8

          gh release edit exe-latest --repo $env:GITHUB_REPOSITORY --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) {
            throw "gh release edit gagal (exit $LASTEXITCODE)"
          }
          Write-Host "::notice::SHA256 terbit di release notes 'exe-latest'"

      - name: Summary
        shell: pwsh
        run: |
          $setup = Get-Item windows/dist/EXAMVAN-Setup.exe -ErrorAction SilentlyContinue
          $portable = Get-Item windows/dist/EXAMVAN.exe -ErrorAction SilentlyContinue
          if ($setup) {
            Write-Host "::notice::EXAMVAN-Setup.exe — $([math]::Round($setup.Length / 1MB, 2)) MB (installer untuk siswa)"
          }
          if ($portable) {
            Write-Host "::notice::EXAMVAN.exe — $([math]::Round($portable.Length / 1MB, 2)) MB (portable)"
          }
