# Build EXAMVAN Windows .exe on GitHub Actions
#
# Trigger: push to main, PR to main, or manual workflow_dispatch
# Produces: EXAMVAN.exe uploaded as build artifact

name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: write  # gh release upload (exe di-release, tidak kena kuota artifact)

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 PyMuPDF pyinstaller

      - name: Build with PyInstaller
        # Entry = desktop/main.py (stub), bukan examvan/__main__.py — file
        # entry PyInstaller dijalankan sebagai script lepas, sedangkan
        # __main__.py memakai relative import yang crash saat exe dijalankan
        # ("attempted relative import with no known parent package").
        run: |
          python -m PyInstaller `
            --onefile `
            --windowed `
            --name "EXAMVAN" `
            --distpath dist `
            --hidden-import examvan `
            --hidden-import examvan.security `
            --hidden-import examvan.ui `
            --hidden-import examvan.ui.styles `
            --hidden-import examvan.ui.timer `
            --hidden-import examvan.ui.pdf_viewer `
            --hidden-import examvan.ui.answer_sheet `
            --hidden-import examvan.ui.exam_viewer `
            --hidden-import examvan.ui.identity_dialog `
            --hidden-import examvan.ui.server_config `
            --hidden-import examvan.security.base `
            --hidden-import examvan.security.enforcer `
            --hidden-import examvan.security.windows_backend `
            --exclude-module examvan.security.x11 `
            --exclude-module examvan.security.linux_backend `
            --exclude-module examvan.security.kiosk `
            --add-data "desktop/examvan;examvan" `
            desktop/main.py
        working-directory: ${{ github.workspace }}

      - name: Upload artifact
        # continue-on-error: kuota Actions storage bisa penuh (pernah — 222
        # artifact lama ~57MB menumpuk). Exe utama dikirim via Release di
        # bawah; artifact hanya bonus.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: EXAMVAN-Windows-${{ matrix.python-version }}
          path: dist/EXAMVAN.exe
          if-no-files-found: error

      - name: Upload exe to release (exe-latest)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "exe-latest"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY `
              --title "EXAMVAN Windows (build terbaru)" `
              --notes "EXAMVAN.exe build otomatis dari branch main. Ganti file setiap build (--clobber)." `
              --prerelease
          }
          gh release upload $tag dist/EXAMVAN.exe --repo $env:GITHUB_REPOSITORY --clobber
          Write-Host "::notice::EXAMVAN.exe terbit di release 'exe-latest'"

      - name: Summary
        shell: pwsh
        run: |
          $exe = Get-Item dist/EXAMVAN.exe -ErrorAction SilentlyContinue
          if ($exe) {
            Write-Host "::notice::EXAMVAN.exe built — $([math]::Round($exe.Length / 1MB, 2)) MB"
          }
