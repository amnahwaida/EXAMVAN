#version: '3.8'

services:
  examvan-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examvan-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - EXAMVAN_SECRET=examvan_super_secret_key_change_me
      - PORT=5000
      - TZ=UTC
    volumes:
      # Persist SQLite Database locally on host filesystem
      - ./server/examvan.db:/app/examvan.db
      # Persist Uploaded PDFs locally on host filesystem
      - ./server/storage:/app/storage

  cloudflare-tunnel:
    build:
      context: ./tunnel
    container_name: examvan-tunnel
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
      - TZ=UTC
    depends_on:
      - examvan-server
