#version: '3.8'

services:
  examvan-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examvan-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - EXAMVAN_SECRET=${EXAMVAN_SECRET:-CHANGE_ME_TO_A_RANDOM_SECRET}
      - PORT=5000
      - TZ=UTC
    volumes:
      # Persist SQLite Database locally on host filesystem
      - ./server/data:/app/data
      # Persist Uploaded PDFs locally on host filesystem
      - ./server/storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cloudflare-tunnel:
    build:
      context: ./tunnel
    container_name: examvan-tunnel
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
      - TZ=UTC
    depends_on:
      - examvan-server
