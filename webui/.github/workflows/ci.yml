name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
      - name: Build server
        run: go build ./cmd/server
