events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Timeouts
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          60s;

    # File upload limit (sync with MAX_FILE_SIZE in Go)
    client_max_body_size  10M;

    # Upstream: webui server instances (scalable via docker compose --scale)
    upstream webui_backend {
        ip_hash;

        # Default single instance; scale with: docker compose up -d --scale webui-server=3
        server webui-server:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy same-origin;

        # Health check endpoint — nginx returns immediately (no proxy to backend)
        location = /api/health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy";
        }
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        # WebSocket endpoint — needs upgrade headers
        location /ws/ {
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;  # 24h — WebSocket long-lived
            proxy_send_timeout 86400s;
        }

        # Static files — long cache (behind versioned hashes)
        location /static/ {
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # All other requests — proxy to backend
        location / {
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Forward cookies so the backend can manage its own session
            proxy_set_header Cookie $http_cookie;
        }
    }
}
