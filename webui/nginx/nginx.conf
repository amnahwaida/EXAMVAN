events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Logging to stdout/stderr for Docker
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Proxy buffer settings
    proxy_buffer_size    8k;
    proxy_buffers        8 8k;

    # Timeouts
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          60s;

    # File upload limit (sync with MAX_FILE_SIZE in Go)
    client_max_body_size  100M;

    # Upstream: webui server instances (scalable via docker compose --scale)
    upstream webui_backend {
        ip_hash;

        # Default single instance; scale with: docker compose up -d --scale webui-server=3
        server webui-server:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80 default_server;
        server_name _;

		# Security headers
		add_header X-Frame-Options DENY;
		add_header X-Content-Type-Options nosniff;
		add_header X-XSS-Protection "1; mode=block";
		add_header Referrer-Policy same-origin;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Health check endpoint — proxy to backend for full JSON response
        location = /api/health {
            access_log off;
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        # WebSocket endpoint — needs upgrade headers
        location /ws/ {
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;  # 24h — WebSocket long-lived
            proxy_send_timeout 86400s;
            proxy_buffering off;  # Required for WebSocket frames
        }

        # Static files — long cache (behind versioned hashes)
        location /static/ {
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # All other requests — proxy to backend
        location / {
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Forward cookies so the backend can manage its own session
            proxy_set_header Cookie $http_cookie;
        }
    }
}
