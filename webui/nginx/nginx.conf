# ============================================================
# Kapasitas koneksi (Lapis 1 — lihat README "Kapasitas Lapis 1")
# ============================================================
# worker_processes: sebelumnya tidak diset → default nginx = 1 PROSES worker,
# sehingga total kapasitas sistem = worker_connections × 1. "auto" melipatgandakan
# plafon sebanyak jumlah core CPU host.
worker_processes  auto;

# Batas file-descriptor proses worker; harus <= ulimits nofile kontainer
# (diset di docker-compose.yml service nginx-lb), jika tidak nginx gagal start
# dengan "setrlimit() failed".
worker_rlimit_nofile 65535;

events {
    # Sebelumnya 2048 — ini adalah PLAFON MUTLAK koneksi serentak seluruh
    # sistem, dan setiap request yang diproxy memakai 2 slot (koneksi klien +
    # koneksi upstream ke Go). Dengan 10240 × #core, koneksi WebSocket siswa
    # berhenti menjadi hambatan pertama jauh sebelum CPU server habis.
    worker_connections  10240;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Logging to stdout/stderr for Docker
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Proxy buffer settings
    proxy_buffer_size    8k;
    proxy_buffers        8 8k;

    # Timeouts
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          60s;

    # File upload limit (sync with MAX_FILE_SIZE in Go)
    client_max_body_size  100M;

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Determine the correct scheme (HTTPS/HTTP) forwarded from client or upstream proxy
    map $http_x_forwarded_proto $the_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Upstream: webui server instances (scalable via docker compose --scale)
    upstream webui_backend {
        ip_hash;

        # Default single instance; scale with: docker compose up -d --scale webui-server=3
        server webui-server:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Cloud-only: tolak request cleartext. Semua request yang TIDAK berasal
        # dari Cloudflare Tunnel (tanpa X-Forwarded-Proto: https) di-redirect ke HTTPS.
        # Request dari tunnel sudah di-terminate TLS di edge Cloudflare dan dikirim
        # sebagai HTTP internal dengan X-Forwarded-Proto: https, sehingga TIDAK ikut
        # ter-redirect — mencegah redirect loop.
        if ($the_scheme != "https") {
            return 301 https://$host$request_uri;
        }

		# Security headers
		add_header X-Frame-Options DENY;
		add_header X-Content-Type-Options nosniff;
		add_header X-XSS-Protection "1; mode=block";
		add_header Referrer-Policy same-origin;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		# Cloudflare Turnstile requires challenges.cloudflare.com in script-src,
		# frame-src (widget iframe), connect-src, and img-src — otherwise the
		# widget never renders and fail-closed forms block submission.
		add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://challenges.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; connect-src 'self' https://cloudflareinsights.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Internal PDF redirect — fallback when R2 is unavailable
        location /internal/pdf/ {
            internal;
            alias /opt/examvan/storage/;
        }

        # Health check endpoint — proxy to backend for full JSON response
        location = /api/health {
            access_log off;
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $the_scheme;
        }
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        # WebSocket endpoint — needs upgrade headers
        location /ws/ {
            # Token kelas masuk lewat query string (`QWebSocket` tidak bisa
            # memasang header request arbitrer), jadi `GET /ws/7?token=...`
            # ikut ter-CATAT apa adanya oleh `access_log` di atas (format
            # `combined` memuat `$request`) — pada setiap connect DAN setiap
            # reconnect (backoff eksponensial sampai 30 s, sepanjang ujian).
            #
            # Kredensial yang lebih sensitif dari `identity_data` tidak
            # boleh bocor lewat log proxy di jalur sekolah; itu sebabnya
            # `api.exam_result` membuang identitas dari query `/result`,
            # dan ini adalah padanannya untuk `/ws/`.
            #
            # `/api/health` dan `/healthz` di atas sudah begitu.
            # Yang masih menyisakan bocoran ada di sisi origin:
            # `gin.Logger()` di `cmd/server/main.go` memakai format yang
            # menempelkan query string ke path — perlu logger yang melewati
            # `/ws/`, atau format yang tidak memuat query sama sekali.
            access_log off;
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $the_scheme;
            proxy_read_timeout 86400s;  # 24h — WebSocket long-lived
            proxy_send_timeout 86400s;
            proxy_buffering off;  # Required for WebSocket frames
        }

        # Static files — long cache (behind versioned hashes)
        location /static/ {
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $the_scheme;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # All other requests — proxy to backend
        location / {
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $the_scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Forward cookies so the backend can manage its own session
            proxy_set_header Cookie $http_cookie;
        }
    }
}
