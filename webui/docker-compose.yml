services:
  db:
    image: postgres:16-alpine
    container_name: examvan-webui-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: examvan
      POSTGRES_USER: examvan
      POSTGRES_PASSWORD: ${DB_PASSWORD?ERR:DB_PASSWORD not set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examvan"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256M
    cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: examvan-webui-redis
    restart: unless-stopped
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 64M
    cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  webui-server:
    build:
      context: ..
      dockerfile: webui/Dockerfile
    container_name: examvan-go-server
    restart: unless-stopped
    # Backend port not exposed to host — access only through nginx.
    expose:
      - "5000"
    environment:
      - EXAMVAN_SECRET=${EXAMVAN_SECRET?ERR:EXAMVAN_SECRET not set}
      - EXAMVAN_ADMIN_USER=${EXAMVAN_ADMIN_USER:-superadmin}
      - EXAMVAN_ADMIN_PASS=${EXAMVAN_ADMIN_PASS?ERR:EXAMVAN_ADMIN_PASS not set}
      - DATABASE_URL=postgresql://examvan:${DB_PASSWORD?ERR:DB_PASSWORD not set}@db:5432/examvan
      - REDIS_URL=redis://redis:6379/0
      - PORT=5000
      - STORAGE_PATH=/app/storage
      - TZ=UTC
      - APP_ENV=${APP_ENV:-production}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-examvan-pdfs}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - DATABASE_MAX_CONNS=${DATABASE_MAX_CONNS:-100}
      - DOKU_CLIENT_ID=${DOKU_CLIENT_ID:-}
      - DOKU_SECRET_KEY=${DOKU_SECRET_KEY:-}
      - DOKU_API_URL=${DOKU_API_URL:-https://api-sandbox.doku.com}
    volumes:
      - webui_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512M
    cpus: '0.5'
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  nginx-lb:
    image: nginx:1.27-alpine
    container_name: examvan-webui-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - webui_storage:/opt/examvan/storage:ro
    depends_on:
      webui-server:
        condition: service_healthy
    mem_limit: 64M
    cpus: '0.25'
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: examvan-webui-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
      - TZ=UTC
    depends_on:
      nginx-lb:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "[ -z \"$TUNNEL_TOKEN\" ] || wget -qO- http://localhost:4312/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

volumes:
  postgres_data:
  webui_storage:

networks:
  internal:
    driver: bridge
