services:
  db:
    image: postgres:16-alpine
    container_name: examvan-webui-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: examvan
      POSTGRES_USER: examvan
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examvan"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  redis:
    image: redis:7-alpine
    container_name: examvan-webui-redis
    restart: unless-stopped
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  webui-server:
    build:
      context: ..
      dockerfile: webui/Dockerfile
    container_name: examvan-go-server
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - EXAMVAN_SECRET=${EXAMVAN_SECRET?ERR:EXAMVAN_SECRET not set}
      - EXAMVAN_ADMIN_USER=${EXAMVAN_ADMIN_USER:-superadmin}
      - EXAMVAN_ADMIN_PASS=${EXAMVAN_ADMIN_PASS?ERR:EXAMVAN_ADMIN_PASS not set}
      - DATABASE_URL=postgresql://examvan:${DB_PASSWORD?ERR:DB_PASSWORD not set}@db:5432/examvan
      - REDIS_URL=redis://redis:6379/0
      - PORT=5000
      - STORAGE_PATH=/app/storage
      - TZ=UTC
    volumes:
      - webui_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx-lb:
    image: nginx:1.27-alpine
    container_name: examvan-webui-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      webui-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  cloudflare-tunnel:
    build:
      context: ../tunnel
      dockerfile: Dockerfile
    container_name: examvan-webui-tunnel
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
      - TZ=UTC
    depends_on:
      nginx-lb:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "[ -z \"$TUNNEL_TOKEN\" ] || wget -qO- http://localhost:4312/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_data:
  webui_storage:
