<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>EXAMVAN - Verifikasi Email</title>
 <link rel="stylesheet" href="/static/css/theme.css?v={{.version}}">
 <link rel="stylesheet" href="/static/css/tailwind/output.css?v={{.version}}">
 <link rel="icon" type="image/png" href="/static/favicon.png">
 <style>
  /* Step progress indicator */
  .reg-steps {
   display: flex;
   align-items: center;
   justify-content: center;
   gap: 0;
   margin-bottom: 28px;
  }
  .reg-step {
   display: flex;
   align-items: center;
   gap: 8px;
  }
  .reg-step-num {
   width: 28px;
   height: 28px;
   border-radius: 50%;
   display: flex;
   align-items: center;
   justify-content: center;
   font-size: 12px;
   font-weight: 700;
   border: 2px solid rgba(255,255,255,0.1);
   color: var(--color-text-muted);
   background: transparent;
   transition: all 0.3s;
   flex-shrink: 0;
  }
  .reg-step.done .reg-step-num {
   border-color: rgba(34,197,94,0.4);
   background: rgba(34,197,94,0.12);
   color: #4ade80;
  }
  .reg-step.active .reg-step-num {
   border-color: rgba(99,102,241,0.5);
   background: rgba(99,102,241,0.15);
   color: #a5b4fc;
   box-shadow: 0 0 12px rgba(99,102,241,0.2);
  }
  .reg-step-label {
   font-size: 12px;
   color: var(--color-text-muted);
   font-weight: 500;
   transition: color 0.3s;
  }
  .reg-step.active .reg-step-label,
  .reg-step.done .reg-step-label {
   color: var(--color-text);
  }
  .reg-step-line {
   width: 40px;
   height: 2px;
   background: rgba(255,255,255,0.06);
   margin: 0 8px;
   border-radius: 2px;
   flex-shrink: 0;
  }
  .reg-step-line.done {
   background: rgba(34,197,94,0.3);
  }

  /* OTP input styling */
  .otp-input-wrapper {
   display: flex;
   justify-content: center;
   gap: 8px;
   margin: 20px 0;
  }
  .otp-digit {
   width: 46px;
   height: 54px;
   text-align: center;
   font-size: 22px;
   font-weight: 700;
   letter-spacing: 0;
   border-radius: 12px;
   background: rgba(255,255,255,0.04);
   border: 1.5px solid rgba(255,255,255,0.08);
   color: #fff;
   outline: none;
   transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
   caret-color: #a5b4fc;
  }
  .otp-digit:focus {
   border-color: rgba(99,102,241,0.5);
   box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
   background: rgba(99,102,241,0.06);
  }
  .otp-digit.filled {
   border-color: rgba(99,102,241,0.35);
   background: rgba(99,102,241,0.08);
  }

  /* Email badge */
  .email-badge {
   display: inline-flex;
   align-items: center;
   gap: 6px;
   padding: 8px 16px;
   border-radius: 10px;
   background: rgba(99,102,241,0.08);
   border: 1px solid rgba(99,102,241,0.15);
   font-size: 14px;
   font-weight: 600;
   color: #a5b4fc;
   letter-spacing: 0.3px;
  }
  .email-badge svg {
   width: 16px;
   height: 16px;
   color: #818cf8;
  }

  /* Info card */
  .otp-info-card {
   background: rgba(255,255,255,0.02);
   border: 1px solid rgba(255,255,255,0.05);
   border-radius: 14px;
   padding: 20px;
   text-align: center;
   margin-bottom: 24px;
   animation: cardFadeIn 0.5s cubic-bezier(.16,1,.3,1) 0.15s both;
  }
  @keyframes cardFadeIn {
   from { opacity: 0; transform: translateY(12px); }
   to { opacity: 1; transform: translateY(0); }
  }

  /* Resend timer */
  .resend-hint {
   text-align: center;
   font-size: 12px;
   color: var(--color-text-muted);
   margin-top: 12px;
  }
  .resend-hint a {
   color: #818cf8;
   text-decoration: none;
   font-weight: 600;
   cursor: pointer;
  }
  .resend-hint a:hover {
   color: #a5b4fc;
  }

  /* Responsive */
  @media (max-width: 480px) {
   .reg-step-label { display: none; }
   .reg-step-line { width: 24px; }
   .otp-digit { width: 40px; height: 48px; font-size: 20px; }
  }
 </style>
</head>
<body class="login-page">
 <div class="login-bg">
  <div class="login-orb login-orb-1"></div>
  <div class="login-orb login-orb-2"></div>
 </div>
 <div class="login-container">
  <div class="login-card">

   <!-- Header -->
   <div class="login-header">
    <div class="login-logo">E</div>
    <h1>EXAMVAN</h1>
    <p class="login-subtitle">Verifikasi Alamat Email Anda</p>
   </div>

   <!-- Step Indicator -->
   <div class="reg-steps">
    <div class="reg-step done">
     <div class="reg-step-num">
      <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m4.5 12.75 6 6 9-13.5"/></svg>
     </div>
     <span class="reg-step-label">Isi Data</span>
    </div>
    <div class="reg-step-line done"></div>
    <div class="reg-step active">
     <div class="reg-step-num">2</div>
     <span class="reg-step-label">Verifikasi</span>
    </div>
   </div>

   <!-- Error Messages -->
   {{if .error}}
   <div class="flash-messages">
    <div class="flash-msg flash-error">
     <svg style="width:16px;height:16px;flex-shrink:0;margin-right:6px;vertical-align:middle;display:inline;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>
     {{.error}}
    </div>
   </div>
   {{end}}

   <!-- OTP Info Card -->
   <div class="otp-info-card">
    <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:12px;line-height:1.6;">
     Kode OTP 6 digit telah dikirim ke:
    </p>
    <div class="email-badge">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/></svg>
     {{.masked_email}}
    </div>
    <p style="font-size:11.5px;color:var(--color-text-muted);margin-top:12px;line-height:1.5;font-style:italic;">
     Periksa juga folder Spam / Promosi jika tidak ditemukan di Inbox.
    </p>
   </div>

   <!-- OTP Form -->
   <form method="POST" action="/register/confirm?username={{.username}}" class="login-form" id="otpForm" autocomplete="off">
    <!-- Hidden real input -->
    <input type="hidden" id="otp_code" name="otp_code" value="">

    <div style="text-align:center;">
     <label style="display:block;margin-bottom:6px;font-weight:500;font-size:13px;color:var(--color-text);">Masukkan Kode OTP</label>
     <div class="otp-input-wrapper" id="otpInputWrapper">
      <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="0" autofocus autocomplete="one-time-code">
      <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="1">
      <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="2">
      <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="3">
      <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="4">
      <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="5">
     </div>
    </div>

    <button type="submit" class="btn-login" id="verifyBtn" style="margin-top:16px;" disabled>
     <svg style="width:18px;height:18px;vertical-align:middle;margin-right:6px;display:inline;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
     Verifikasi Akun
    </button>
   </form>

   <div class="resend-hint" id="resendHint">
    <span id="resendTimer">Kode berlaku selama 15 menit</span>
   </div>

   <hr class="divider-subtle" style="margin:20px 0 14px;">
   <div class="login-link-row">
    <span class="login-link-text"><a href="/register">← Kembali ke Pendaftaran</a></span>
   </div>

  </div>
 </div>

 <script>
 document.addEventListener('DOMContentLoaded', function() {
  var digits = document.querySelectorAll('.otp-digit');
  var hiddenInput = document.getElementById('otp_code');
  var verifyBtn = document.getElementById('verifyBtn');
  var form = document.getElementById('otpForm');

  function syncHidden() {
   var code = '';
   digits.forEach(function(d) { code += d.value; });
   hiddenInput.value = code;
   verifyBtn.disabled = code.length < 6;
   // Visual feedback
   digits.forEach(function(d) {
    if (d.value) d.classList.add('filled');
    else d.classList.remove('filled');
   });
  }

  digits.forEach(function(input, idx) {
   input.addEventListener('input', function(e) {
    // Only allow digits
    this.value = this.value.replace(/[^0-9]/g, '');
    if (this.value && idx < digits.length - 1) {
     digits[idx + 1].focus();
    }
    syncHidden();
   });

   input.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace' && !this.value && idx > 0) {
     digits[idx - 1].focus();
     digits[idx - 1].value = '';
     syncHidden();
    }
    if (e.key === 'ArrowLeft' && idx > 0) {
     e.preventDefault();
     digits[idx - 1].focus();
    }
    if (e.key === 'ArrowRight' && idx < digits.length - 1) {
     e.preventDefault();
     digits[idx + 1].focus();
    }
   });

   input.addEventListener('focus', function() {
    this.select();
   });

   // Handle paste
   input.addEventListener('paste', function(e) {
    e.preventDefault();
    var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
    for (var i = 0; i < Math.min(paste.length, 6); i++) {
     digits[i].value = paste[i];
    }
    var focusIdx = Math.min(paste.length, 5);
    digits[focusIdx].focus();
    syncHidden();
   });
  });

  // Submit loading
  if (form && verifyBtn) {
   form.addEventListener('submit', function(e) {
    if (hiddenInput.value.length < 6) {
     e.preventDefault();
     return;
    }
    verifyBtn.classList.add('loading');
    verifyBtn.disabled = true;
    verifyBtn.innerHTML = '<span style="vertical-align:middle;">Memverifikasi...</span>';
   });
  }

  // Auto-dismiss flash messages
  var flashMessages = document.querySelector('.flash-messages');
  if (flashMessages) {
   setTimeout(function() {
    flashMessages.style.transition = 'opacity 0.5s ease';
    flashMessages.style.opacity = '0';
    setTimeout(function() { flashMessages.style.display = 'none'; }, 500);
   }, 6000);
  }
 });
 </script>
</body>
</html>
