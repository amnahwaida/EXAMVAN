<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>EXAMVAN - Lupa Password</title>
 <meta name="description" content="{{.seo_description}}">
 <meta name="robots" content="noindex, nofollow">
 <link rel="stylesheet" href="/static/css/theme.css?v={{.version}}">
 <link rel="stylesheet" href="/static/css/tailwind/output.css?v={{.version}}">
 <link rel="icon" type="image/png" href="/static/favicon.png">
 <meta name="csrf-token" content="{{.csrf_token}}">
 <style>
  /* Prevent iOS Safari auto-zoom on focus. */
  .login-form .form-group input { font-size: 16px; }
 </style>
 <link rel="stylesheet" href="/static/css/public-mobile.css?v={{.version}}-1">
</head>
<body class="login-page">
 <a href="#main-content" class="skip-link" style="position:absolute;left:-9999px;z-index:9999;padding:12px 20px;background:var(--color-primary,#6366f1);color:white;border-radius:8px;font-weight:600;text-decoration:none;">Langsung ke konten</a>
 <div class="login-bg">
 <div class="login-orb login-orb-1"></div>
 <div class="login-orb login-orb-2"></div>
 </div>
 <div class="login-container" id="main-content">
 <div class="login-card">
 <div class="login-header">
 <div class="login-logo">E</div>
 <h1>EXAMVAN</h1>
 <p class="login-subtitle">Reset Password Akun</p>
 </div>

 {{if .error}}
 <div class="flash-messages">
 <div class="flash-msg flash-error">{{.error}}</div>
 </div>
 {{end}}

 <p style="font-size:13px;color:var(--color-text-secondary);line-height:1.6;margin:0 0 16px;text-align:center;">
  Masukkan username akun Anda. Kami akan mengirimkan kode verifikasi (OTP) ke email yang terdaftar untuk mereset password.
 </p>

 <form method="POST" action="/forgot-password" class="login-form" id="forgotForm">
 <div class="form-group">
 <label class="required" for="username">Username</label>
 <input type="text" id="username" name="username" placeholder="Masukkan username" required autofocus autocomplete="username">
 </div>
 <button type="submit" class="btn-login" id="forgotSubmitBtn">Kirim Kode Reset</button>
 </form>

 <div class="login-link-row" style="margin-top:14px;">
 <span class="login-link-text"><a href="/login">← Kembali ke Login</a></span>
 </div>
 <div class="login-footer"><p>&copy; 2026 EXAMVAN</p></div>
 </div>
 </div>
 <script>
 document.addEventListener('DOMContentLoaded', function() {
  var form = document.getElementById('forgotForm');
  var btn = document.getElementById('forgotSubmitBtn');
  if (form && btn) {
   form.addEventListener('submit', function() { btn.classList.add('loading'); btn.disabled = true; btn.textContent = 'Mengirim...'; });
  }
  var flash = document.querySelector('.flash-messages');
  if (flash) {
   setTimeout(function() {
    flash.style.transition = 'opacity 0.5s ease';
    flash.style.opacity = '0';
    setTimeout(function() { flash.style.display = 'none'; }, 500);
   }, 6000);
  }
 });
 </script>
</body>
</html>
