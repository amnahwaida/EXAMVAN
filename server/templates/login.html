<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>EXAMVAN - Admin Login</title>
 <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}?v={{ version }}">
 <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind/output.css') }}?v={{ version }}">
 <link rel="icon" type="image/png" href="/static/favicon.png">
 <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body class="login-page">
 <a href="#main-content" class="skip-link" style="position:absolute;left:-9999px;z-index:9999;padding:12px 20px;background:var(--color-primary,#6366f1);color:white;border-radius:8px;font-weight:600;text-decoration:none;">Langsung ke konten</a>
 <div class="login-bg">
 <div class="login-orb login-orb-1"></div>
 <div class="login-orb login-orb-2"></div>
 </div>
 <div class="login-container" id="main-content">
 <div class="login-card">
 <div class="login-header">
 <div class="login-logo">E</div>
 <h1>EXAMVAN</h1>
 <p class="login-subtitle">Panel Admin — Kelola Ujian Digital</p>
 </div>
 {% with messages = get_flashed_messages(with_categories=true) %}
 {% if messages %}
 <div class="flash-messages">
 {% for category, message in messages %}
 <div class="flash-msg flash-{{ category }}">{{ message }}</div>
 {% endfor %}
 </div>
 {% endif %}
 {% endwith %}
 <form method="POST" action="{{ url_for('admin_login') }}" class="login-form" id="loginForm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
 <div class="form-group">
 <label  class="required" for="username">Username</label>
 <input type="text" id="username" name="username" placeholder="Masukkan username" required autofocus autocomplete="username">
 </div>
 <div class="form-group">
 <label  class="required" for="password">Password</label>
 <div class="password-wrapper">
 <input type="password" id="password" name="password" placeholder="Masukkan password" minlength="8" required autocomplete="current-password">
 <button type="button" id="togglePassword" class="password-toggle-btn" aria-label="Tampilkan password">
 <svg class="pw-icon pw-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
 </button>
 </div>
 </div>
 <button type="submit" class="btn-login" id="loginSubmitBtn">Masuk</button>
 </form>
 <div class="login-link-row">
 <span class="login-link-text">Belum memiliki akun? <a href="{{ url_for('register') }}">Daftar Sebagai Guru</a></span>
 </div>
 <div class="login-footer"><p>&copy; 2026 EXAMVAN</p></div>
 </div>
 </div>
 <script src="{{ url_for('static', filename='js/admin-core.js') }}?v={{ version }}"></script>
 <script>
 document.addEventListener('DOMContentLoaded', function() {
 togglePasswordVisibility('password', 'togglePassword');
 const form = document.getElementById('loginForm');
 const btn = document.getElementById('loginSubmitBtn');
 if (form && btn) {
 form.addEventListener('submit', function() { btn.classList.add('loading'); btn.disabled = true; btn.textContent = 'Memproses...'; });
 if (document.querySelector('.flash-messages')) {
  btn.classList.remove('loading');
  btn.disabled = false;
 }
 }
 /* Auto-dismiss flash messages after 5 seconds with fade-out */
 var flashMessages = document.querySelector('.flash-messages');
 if (flashMessages) {
  setTimeout(function() {
   flashMessages.style.transition = 'opacity 0.5s ease';
   flashMessages.style.opacity = '0';
   setTimeout(function() { flashMessages.style.display = 'none'; }, 500);
  }, 5000);
 }
 });
 </script>
</body>
</html>
