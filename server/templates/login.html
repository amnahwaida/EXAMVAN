<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXAMVAN - Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind/output.css') }}?v=2.1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="icon" type="image/png" href="/static/favicon.png">
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden relative" style="background: radial-gradient(circle at 50% 0%, #17152f 0%, #0c0a1a 50%, #06050b 100%);">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-[500px] h-[500px] rounded-full opacity-10" style="background: radial-gradient(circle, rgba(168,85,247,0.3), transparent 70%); filter: blur(80px);"></div>
        <div class="absolute -bottom-40 -left-40 w-[400px] h-[400px] rounded-full opacity-10" style="background: radial-gradient(circle, rgba(99,102,241,0.3), transparent 70%); filter: blur(80px);"></div>
    </div>
    <div class="relative z-10 w-full max-w-md px-6">
        <div class="bg-[rgba(15,15,30,0.45)] backdrop-blur-xl border border-[rgba(255,255,255,0.08)] rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-14 h-14 mx-auto mb-4 rounded-xl flex items-center justify-center text-white text-2xl font-extrabold shadow-lg" style="background: linear-gradient(135deg, #6366f1, #8b5cf6);">E</div>
                <h1 class="text-2xl font-bold text-white">EXAMVAN</h1>
                <p class="text-sm text-[#cbd5e1] mt-1">Panel Admin — Kelola Ujian Digital</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="mb-4">
                {% for category, message in messages %}
                <div class="px-4 py-3 rounded-lg text-sm font-medium
                    {% if category == 'error' %}bg-red-500/10 text-red-400 border border-red-500/20
                    {% elif category == 'success' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20
                    {% elif category == 'warning' %}bg-amber-500/10 text-amber-400 border border-amber-500/20
                    {% else %}bg-blue-500/10 text-blue-400 border border-blue-500/20{% endif %}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}
            <form method="POST" action="{{ url_for('admin_login') }}" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-semibold uppercase tracking-wide text-[#64748b] mb-1.5">Username</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username" required autofocus
                        class="w-full px-4 py-3 bg-[rgba(255,255,255,0.03)] border border-[rgba(255,255,255,0.08)] rounded-lg text-white text-sm outline-none transition-all duration-200 focus:border-[#6366f1] focus:bg-[rgba(99,102,241,0.05)] focus:shadow-[0_0_0_3px_rgba(99,102,241,0.25)] placeholder:text-[#64748b]">
                </div>
                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wide text-[#64748b] mb-1.5">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required
                        class="w-full px-4 py-3 bg-[rgba(255,255,255,0.03)] border border-[rgba(255,255,255,0.08)] rounded-lg text-white text-sm outline-none transition-all duration-200 focus:border-[#6366f1] focus:bg-[rgba(99,102,241,0.05)] focus:shadow-[0_0_0_3px_rgba(99,102,241,0.25)] placeholder:text-[#64748b]">
                </div>
                <button type="submit" class="w-full py-3 px-6 rounded-xl text-white font-semibold text-sm shadow-lg transition-all duration-200 active:scale-[0.97]" style="background: linear-gradient(135deg, #6366f1, #8b5cf6); box-shadow: 0 4px 20px rgba(99,102,241,0.35);">Masuk</button>
            </form>
            <div class="text-center mt-6">
                    Belum memiliki akun? <a href="{{ url_for('register') }}" style="color: var(--accent); text-decoration: none; font-weight: 600; border-bottom: 1px dashed var(--accent);">Daftar Sebagai Guru</a>
                </p>
            </div>
            <div class="login-footer"><p>EXAMVAN v2.0.0</p></div>
        </div>
    </div>
</body>
</html>
